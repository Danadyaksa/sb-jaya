<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="url(#bgGrad)" rx="12"/>
  
  <!-- Decorative Grid Pattern -->
  <g opacity="0.15" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="75" x2="400" y2="75" />
    <line x1="0" y1="150" x2="400" y2="150" />
    <line x1="0" y1="225" x2="400" y2="225" />
    <line x1="100" y1="0" x2="100" y2="300" />
    <line x1="200" y1="0" x2="200" y2="300" />
    <line x1="300" y1="0" x2="300" y2="300" />
  </g>
  
  <!-- Center Car Accessory / Shopping Icon Circle -->
  <circle cx="200" cy="120" r="54" fill="#ffffff" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.06))"/>
  
  <!-- Car & Spark Icon -->
  <g transform="translate(176, 96)" fill="none" stroke="url(#accentGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Car body outline -->
    <path d="M5 26 L10 13 C11 10 13 8 16 8 L32 8 C35 8 37 10 38 13 L43 26" />
    <rect x="2" y="26" width="44" height="14" rx="4" />
    <!-- Wheels -->
    <circle cx="11" cy="40" r="4.5" fill="#ef4444" />
    <circle cx="37" cy="40" r="4.5" fill="#ef4444" />
    <!-- Headlights -->
    <line x1="6" y1="31" x2="11" y2="31" stroke-width="3" />
    <line x1="37" y1="31" x2="42" y2="31" stroke-width="3" />
  </g>
  
  <!-- Text Label -->
  <text x="200" y="205" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#334155">
    AKSESORIS MOBIL
  </text>
  <text x="200" y="226" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#94a3b8">
    SB JAYA • Foto Produk Segera Hadir
  </text>
</svg>
